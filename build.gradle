plugins 
{
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.version}+${project.minecraft_version}"
}

dependencies 
{
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Fabric Loader and Fabric API (Required)
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
	withSourcesJar()
}

processResources 
{
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Inspired by C2ME-fabric's Gradle build.
// Allows reproducible builds, skip file timestamps and skip archive versioning being added
// at the end of the JAR file name when the base{} task already adds both the version and
// the minecraft version made for it.
tasks.withType(AbstractArchiveTask) 
{
    preserveFileTimestamps = false
    reproducibleFileOrder = true
	archiveVersion = ""
}

tasks.withType(JavaCompile).configureEach
{
	it.options.release = 21
	options.encoding = "UTF-8"
}

loom {
	accessWidenerPath = file("src/main/resources/timechangerstruggle.client.accesswidener");
}

jar 
{
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename {"${project.archives_base_name}-LICENSE"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {}
}

repositories {}
